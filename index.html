<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c05621"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Müteahhit">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Müteahhit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;font-family:system-ui,-apple-system,sans-serif;background:#f3ead8;color:#2d2d2d}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
#top{background:linear-gradient(#dd6b20,#c05621);color:#fff;padding:8px 10px;display:flex;justify-content:space-between;font-weight:700;font-size:15px;box-shadow:0 2px 6px #0003}
#day{height:4px;background:#0003}#day i{display:block;height:100%;background:#fbd38d;width:0}
#main{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
#tabs{display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:11px;font-weight:600;color:#777}
#tabs button span{display:block;font-size:22px}#tabs button.on{color:#c05621;background:#fff5eb}
.card{background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 2px 5px #0001}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:4px 0}
h3{margin:0 0 6px;font-size:16px}small{color:#777}
.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;background:#dd6b20;color:#fff;min-height:38px}
.btn.g{background:#38a169}.btn.b{background:#3182ce}.btn.x{background:#a0aec0}.btn:disabled{opacity:.4}
.bar{height:16px;background:#edf2f7;border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f6ad55,#dd6b20);transition:width .5s}
.st{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}.st b{font-size:10px;padding:3px 5px;border-radius:6px;background:#edf2f7;color:#888;font-weight:600}
.st b.d{background:#c6f6d5;color:#276749}.st b.c{background:#fbd38d;color:#7b341e}
.mt{font-size:12px;display:flex;flex-wrap:wrap;gap:4px}.mt span{background:#f7fafc;border-radius:6px;padding:2px 6px}.mt .no{background:#fed7d7;color:#c53030}
.chip{font-size:11px;background:#ebf8ff;border-radius:6px;padding:3px 6px;margin:2px;display:inline-block}
#msg{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;background:#9ae6b4;padding:8px;border-radius:12px;background-image:linear-gradient(#a0aec0 0 0),linear-gradient(#a0aec0 0 0);background-size:4px 100%,100% 4px;background-position:33.5% 0,0 50%;background-repeat:no-repeat}.plot{background:#c6f6d5;border:2px dashed #68d391;border-radius:10px;min-height:92px;padding:4px;text-align:center;font-size:11px}.plot.bld{background:#fefcbf;border:2px solid #ecc94b}.plot.own{background:#bee3f8;border:2px solid #4299e1}.plot.sel{outline:3px solid #dd6b20}.pe{font-size:30px}.house{font-size:40px;text-align:center}
</style></head><body><div id="app">
<div id="top"><span id="mo"></span><span id="dy"></span><span id="sd"></span></div><div id="day"><i id="dp"></i></div>
<div id="main"></div>
<div id="tabs"><button data-t="s" class="on"><span>🏗️</span>Şantiye</button><button data-t="h"><span>🗺️</span>Harita</button><button data-t="p"><span>👷</span>Personel</button><button data-t="m"><span>🧱</span>Malzeme</button><button data-t="u"><span>⬆️</span>Yükseltmeler</button></div>
</div><div id="msg"></div>
<script>
const DAY=30,NP=12;// saniye = 1 gün
const MAT={cimento:['Çimento','🪨','torba',20],demir:['Demir','🔩','ton',30],tugla:['Tuğla','🧱','adet',1],kum:['Kum','⏳','m³',10],kereste:['Kereste','🪵','m³',25],boya:['Boya','🎨','kova',20],kablo:['Kablo/Boru','🔌','top',15]};
const STG=[['Hafriyat',30,{},0],['Temel',50,{cimento:20,demir:10,kum:10},1],['Kaba inşaat (Karkas)',80,{cimento:30,demir:20,kereste:10},1],['Duvar örme',60,{tugla:1000,cimento:10},0],['Çatı',40,{kereste:20},0],['Elektrik-Tesisat',40,{kablo:20},1],['Sıva',40,{cimento:15,kum:20},0],['Boya',30,{boya:15},0],['Teslim',10,{},1]];
const PRJ={ev:{n:'Müstakil Ev',e:'🏠',land:1000,k:1,sell:14000,need:0,lv:0},villa:{n:'Villa',e:'🏡',land:4000,k:2.5,sell:36000,need:2,lv:5},apt:{n:'Apartman',e:'🏢',land:12000,k:6,sell:95000,need:5,lv:10}};
const STF={isci:{n:'İşçi',e:'👷',hire:300,wage:40,pow:1},kalfa:{n:'Kalfa',e:'🧑‍🔧',hire:900,wage:90,pow:2.5},usta:{n:'Usta',e:'👨‍🏭',hire:2200,wage:180,pow:5},muh:{n:'Mühendis',e:'👩‍💼',hire:2000,wage:150,pow:0}};
const def=()=>({m:15000,day:1,t:0,sold:0,staff:[],inv:Object.fromEntries(Object.keys(MAT).map(k=>[k,0])),sites:[],nid:1,sid:1,key:0,star:0});
let S;try{S=JSON.parse(localStorage.getItem('muteahhit'))}catch(e){}if(!S)S=def();S.key=S.key||0;S.star=S.star||0;S.sel=-1;S.sites.forEach(x=>{if(x.pl==null){for(let i=0;i<NP;i++)if(!S.sites.some(y=>y.pl===i)){x.pl=i;break}}});
let tab='s';const $=i=>document.getElementById(i),f=n=>Math.round(n).toLocaleString('tr-TR');
const save=()=>localStorage.setItem('muteahhit',JSON.stringify(S));
function toast(t){$('msg').textContent=t;$('msg').style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$('msg').style.opacity=0,1600)}
const wage=s=>STF[s.t].wage*(1+.15*(s.l-1));
const power=s=>STF[s.t].pow*(1+.2*(s.l-1))*(1+.25*s.tool);
const need=(site,i)=>Object.fromEntries(Object.entries(STG[i][2]).map(([k,v])=>[k,Math.ceil(v*PRJ[site.type].k)]));
const onSite=id=>S.staff.filter(s=>s.site==id);
const hasEng=id=>onSite(id).some(s=>s.t=='muh');
function rate(site){const w=onSite(site.id);let p=w.filter(s=>s.t!='muh').reduce((a,s)=>a+power(s),0);const e=w.filter(s=>s.t=='muh');
 if(STG[site.st][3]&&!e.length)return 0;p*=1+e.reduce((a,s)=>a+.15*s.l,0);return p/PRJ[site.type].k}
function price(site){const e=Math.max(0,...S.staff.filter(s=>s.t=='muh').map(s=>s.l));return PRJ[site.type].sell*(1+.05*e)}
function tick(){S.t++;for(const site of S.sites){if(!site.go||site.done)continue;site.p+=rate(site);const w=STG[site.st][1];
 if(site.p>=w){site.p=0;site.go=0;const k=PRJ[site.type].k,ak=Math.ceil(k),ay=Math.ceil(k);S.key+=ak;S.star+=ay;toast('✅ '+STG[site.st][0]+' tamamlandı +'+ak+'🔑 +'+ay+'⭐');if(site.st==STG.length-1){site.done=1;onSite(site.id).forEach(s=>s.site=0);const bk=Math.ceil(8*k),by=Math.ceil(5*k);S.key+=bk;S.star+=by;setTimeout(()=>toast('🏆 Proje bitti! Bonus +'+bk+'🔑 +'+by+'⭐'),1700)}else site.st++}}
 if(S.t>=DAY){S.t=0;S.day++;const w=S.staff.reduce((a,s)=>a+wage(s),0),ri=S.sites.filter(x=>x.rent).reduce((a,x)=>a+rentOf(x),0);S.m+=ri-w;if(w||ri)toast('📅 Gün '+S.day+': maaş -'+f(w)+'₺'+(ri?' · kira +'+f(ri)+'₺':''));if(S.m<0)toast('⚠️ Kasa eksiye düştü!')}
 save();render()}
const A={
 tab:t=>{tab=t},
 land:t=>{const p=PRJ[t],g=gate(t);if(g)return toast(g);let pl=S.sel>=0&&!S.sites.some(y=>y.pl==S.sel)?S.sel:[...Array(NP).keys()].find(i=>!S.sites.some(y=>y.pl==i));if(pl==null)return toast('Boş arsa yok');S.sel=-1;if(S.m<p.land)return toast('Yetersiz para');S.m-=p.land;S.sites.push({id:S.sid++,type:t,st:0,p:0,go:0,done:0,pl});toast(p.n+' arsası alındı (Parsel '+(pl+1)+')')},
 pick:i=>{S.sel=+i;const x=S.sites.find(y=>y.pl==i);if(x&&!x.done){tab='s'}},
 rent:id=>{const x=S.sites.find(s=>s.id==id);x.rent=1;toast('🔑 Kiraya verildi: +'+f(rentOf(x))+'₺/gün')},
 start:id=>{const site=S.sites.find(s=>s.id==id),n=need(site,site.st);for(const k in n)if(S.inv[k]<n[k])return toast('Eksik malzeme: '+MAT[k][0]);
  if(STG[site.st][3]&&!hasEng(id))return toast('Bu aşama için Mühendis gerekli');if(!onSite(id).some(s=>s.t!='muh'))return toast('Önce işçi ata');for(const k in n)S.inv[k]-=n[k];site.go=1;toast('🚧 '+STG[site.st][0]+' başladı')},
 buyn:id=>{const site=S.sites.find(s=>s.id==id),n=need(site,site.st);let c=0;for(const k in n)c+=Math.max(0,n[k]-S.inv[k])*MAT[k][3];if(S.m<c)return toast('Yetersiz para ('+f(c)+'₺)');S.m-=c;for(const k in n)S.inv[k]=Math.max(S.inv[k],n[k]);toast('Malzemeler alındı -'+f(c)+'₺')},
 idle:id=>{let c=0;S.staff.forEach(s=>{if(!s.site){s.site=+id;c++}});toast(c?c+' personel atandı':'Boşta personel yok')},
 sell:id=>{const i=S.sites.findIndex(s=>s.id==id),site=S.sites[i],p=price(site);S.m+=p;S.sold++;onSite(+id).forEach(s=>s.site=0);S.sites.splice(i,1);toast('💰 Satıldı: +'+f(p)+'₺')},
 hire:t=>{const c=STF[t].hire;if(S.m<c)return toast('Yetersiz para');S.m-=c;S.staff.push({id:S.nid++,t,l:1,tool:0,site:0});toast(STF[t].n+' işe alındı')},
 fire:id=>{S.staff=S.staff.filter(s=>s.id!=id)},
 asg:id=>{const s=S.staff.find(s=>s.id==id),ids=[0,...S.sites.filter(x=>!x.done).map(x=>x.id)];s.site=ids[(ids.indexOf(s.site)+1)%ids.length]||0},
 buy:a=>{const[k,q]=a.split(':'),c=MAT[k][3]*q;if(S.m<c)return toast('Yetersiz para');S.m-=c;S.inv[k]+=+q},
 lvl:id=>{const s=S.staff.find(s=>s.id==id),c=lvC(s),y=s.l*2;if(s.l>=10)return toast('Maks seviye');if(S.m<c)return toast('Yetersiz para');if(S.star<y)return toast(y+'⭐ gerekli');S.m-=c;S.star-=y;s.l++;toast(STF[s.t].n+' seviye '+s.l)},
 tool:id=>{const s=S.staff.find(s=>s.id==id),c=tlC(s),a=(s.tool+1)*3;if(s.tool>=5)return toast('Maks ekipman');if(S.m<c)return toast('Yetersiz para');if(S.key<a)return toast(a+'🔑 gerekli');S.m-=c;S.key-=a;s.tool++;toast('🔧 Ekipman '+s.tool)},
 reset:()=>{if(confirm('Tüm ilerleme silinsin mi?')){S=def();}}};
const gate=t=>{const p=PRJ[t];if(!p.lv)return S.sold<p.need?p.need+' satış gerekli':'';const n=S.staff.length,r=S.staff.filter(s=>s.l>=p.lv).length;if(!n)return p.n+': en az 1 personel gerekli';if(r<n)return p.n+': tüm personel Sv.'+p.lv+' olmalı ('+r+'/'+n+' hazır)';if(S.sold<p.need)return p.n+': '+p.need+' satış gerekli ('+S.sold+'/'+p.need+')';return ''};
const rentOf=x=>Math.round(PRJ[x.type].sell*.04);
const lvC=s=>Math.round(STF[s.t].hire*.5*s.l),tlC=s=>Math.round(STF[s.t].hire*.35*(s.tool+1));
const B=(a,x,t,c='',dis)=>`<button class="btn ${c}" data-a="${a}" data-x="${x}" ${dis?'disabled':''}>${t}</button>`;
function render(){const tw=S.staff.reduce((a,s)=>a+wage(s),0);$('mo').textContent='💰 '+f(S.m)+'₺';$('dy').textContent='🔑'+S.key+' ⭐'+S.star+' · G'+S.day;$('sd').textContent='👷 '+S.staff.length+' · -'+f(tw)+'/gün';$('dp').style.width=S.t/DAY*100+'%';
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));let h='';
if(tab=='s'){S.sites.forEach(site=>{const P=PRJ[site.type],w=onSite(site.id),n=need(site,site.st),st=STG[site.st],r=rate(site);
 h+=`<div class="card"><div class="row"><h3>${P.e} ${P.n} #${site.id}</h3><small>${site.done?'Hazır':'Aşama '+(site.st+1)+'/'+STG.length}</small></div>
 <div class="st">${STG.map((s,i)=>`<b class="${i<site.st||site.done?'d':i==site.st?'c':''}">${s[0]}</b>`).join('')}</div>`;
 if(site.done)h+=`<div class="house">${P.e}${site.rent?'🔑':'🎉'}</div><div class="row">`+(site.rent?'<small>Kirada: +'+f(rentOf(site))+'₺/gün</small>':B('rent',site.id,'🔑 Kirala +'+f(rentOf(site))+'₺/gün','b'))+B('sell',site.id,'Sat: +'+f(price(site))+'₺','g')+'</div>';
 else{h+=`<div class="row"><b>${st[0]}${st[3]?' 👩‍💼':''}</b><small>${site.go?(r?'%'+Math.floor(site.p/st[1]*100)+' · ~'+Math.ceil((st[1]-site.p)/r)+'sn':'Durdu (personel?)'):'Bekliyor'}</small></div><div class="bar"><i style="width:${site.p/st[1]*100}%"></i></div>`;
  if(!site.go){h+=`<div class="mt">${Object.keys(n).length?Object.entries(n).map(([k,v])=>`<span class="${S.inv[k]<v?'no':''}">${MAT[k][1]} ${MAT[k][0]} ${f(S.inv[k])}/${f(v)}</span>`).join(''):'<span>Malzeme gerekmez</span>'}</div>`}
  h+=`<div>${w.map(s=>`<span class="chip">${STF[s.t].e} ${STF[s.t].n} Lv${s.l}</span>`).join('')||'<small>Personel atanmadı</small>'}</div><div class="row">`+B('idle',site.id,'👷 Boştakileri ata','b')+(site.go?'':(Object.keys(n).length?B('buyn',site.id,'🛒 Eksikleri al','x'):'')+B('start',site.id,'▶ Başlat','g'))+'</div>'}
 h+='</div>'});
 h+='<div class="card"><h3>🗺️ Yeni Proje (Arsa al)</h3>'+Object.entries(PRJ).map(([k,p])=>`<div class="row"><span>${p.e} <b>${p.n}</b><br><small>Satış ~${f(p.sell)}₺${gate(k)?'<br><b style="color:#c53030">🔒 '+gate(k)+'</b>':''}</small></span>${B('land',k,(gate(k)?'🔒 ':'')+f(p.land)+'₺','',!!gate(k))}</div>`).join('')+`<small>Toplam satış: ${S.sold}</small></div>`}
if(tab=='h'){h='<div class="card"><h3>🗺️ Şehir Haritası</h3><small>Boş parsele dokun, proje seç. Biten binalar mülkün olarak kalır.</small><div class="map">';for(let i=0;i<NP;i++){const x=S.sites.find(y=>y.pl==i);let c='';
 if(!x)c=`<div class="pe">${i+1}</div><small>Boş</small>`;else if(x.done)c=`<div class="pe">${PRJ[x.type].e}</div><small>${x.rent?'🔑 Kirada':'✅ Hazır'}</small>`;else c=`<div class="pe">🏗️</div><small>${STG[x.st][0]}</small><div class="bar" style="height:6px;margin:2px 0"><i style="width:${x.p/STG[x.st][1]*100}%"></i></div><small>${x.st+1}/9</small>`;
 h+=`<div class="plot ${x?(x.done?'own':'bld'):''} ${S.sel==i?'sel':''}" data-a="pick" data-x="${i}">${c}</div>`}h+='</div></div>';
 const x=S.sites.find(y=>y.pl==S.sel);if(S.sel>=0&&!x)h+='<div class="card"><h3>Parsel '+(S.sel+1)+': Proje seç</h3>'+Object.entries(PRJ).map(([k,p])=>`<div class="row"><span>${p.e} <b>${p.n}</b><br><small>Satış ~${f(p.sell)}₺${gate(k)?'<br><b style="color:#c53030">🔒 '+gate(k)+'</b>':''}</small></span>${B('land',k,(gate(k)?'🔒 ':'')+f(p.land)+'₺','',!!gate(k))}</div>`).join('')+'</div>';
 if(x&&x.done)h+=`<div class="card"><h3>${PRJ[x.type].e} ${PRJ[x.type].n} (Parsel ${S.sel+1})</h3><div class="row">`+(x.rent?'<small>Kirada: +'+f(rentOf(x))+'₺/gün</small>':B('rent',x.id,'🔑 Kirala +'+f(rentOf(x))+'₺/gün','b'))+B('sell',x.id,'Sat: +'+f(price(x))+'₺','g')+'</div></div>'}
if(tab=='p'){h='<div class="card"><h3>İşe Al</h3>'+Object.entries(STF).map(([k,s])=>`<div class="row"><span>${s.e} <b>${s.n}</b><br><small>${k=='muh'?'🏛️ Temel/Karkas/Tesisat/Teslim için gerekli, hız +%15/sv, satış +%5/sv':'Hız '+s.pow}, maaş ${s.wage}₺/gün</small></span>${B('hire',k,f(s.hire)+'₺')}</div>`).join('')+'</div>';
 h+='<div class="card"><h3>Ekibim</h3>'+(S.staff.map(s=>{const site=S.sites.find(x=>x.id==s.site);return `<div class="row"><span>${STF[s.t].e} ${STF[s.t].n} Lv${s.l} 🔧${s.tool}<br><small>${s.t=='muh'?'':'Hız '+power(s).toFixed(1)+' · '}${f(wage(s))}₺/gün</small></span>${B('asg',s.id,site?PRJ[site.type].e+' #'+site.id:'Boşta','b')}${B('fire',s.id,'✖','x')}</div>`}).join('')||'<small>Henüz personel yok</small>')+'</div>'}
if(tab=='m'){h='<div class="card"><h3>🛒 Malzeme Pazarı</h3>'+Object.entries(MAT).map(([k,m])=>{const q=k=='tugla'?500:10;return `<div class="row"><span>${m[1]} <b>${m[0]}</b><br><small>${m[3]}₺/${m[2]} · Depo: ${f(S.inv[k])}</small></span><span>${B('buy',k+':'+q,'+'+q)} ${B('buy',k+':'+q*10,'+'+q*10,'b')}</span></div>`}).join('')+'</div>'}
if(tab=='u'){h='<div class="card"><h3>⬆️ Yükseltmeler</h3><small>Seviye: hız +%20 (mühendis: bonus artar). Ekipman: hız +%25. Her imalat kalemi bitince 🔑 ve ⭐ kazanırsın, proje bitince büyük bonus!</small></div>'+(S.staff.map(s=>`<div class="card"><div class="row"><b>${STF[s.t].e} ${STF[s.t].n} #${s.id}</b><small>Lv${s.l} · 🔧${s.tool}</small></div><div class="row">${B('lvl',s.id,'⭐ Seviye '+f(lvC(s))+'₺ + '+s.l*2+'⭐','',s.l>=10)}${s.t!='muh'?B('tool',s.id,'🔧 Ekipman '+f(tlC(s))+'₺ + '+(s.tool+1)*3+'🔑','b',s.tool>=5):''}</div></div>`).join('')||'<div class="card"><small>Önce personel işe al</small></div>');
 h+=`<div class="card">${B('reset',0,'🗑️ Oyunu sıfırla','x')}</div>`}
$('main').innerHTML=h}
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-t]');if(!b)return;if(b.dataset.t)A.tab(b.dataset.t);else A[b.dataset.a](b.dataset.x);save();render()});
document.addEventListener('gesturestart',e=>e.preventDefault());
setInterval(tick,1000);render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
