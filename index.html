<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Müteahhit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;font-family:system-ui,-apple-system,sans-serif;background:#f3ead8;color:#2d2d2d}
#app{display:flex;flex-direction:column;height:100%}
#top{position:relative;z-index:5;flex:none;opacity:1;background:#c05621;color:#fff;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;-webkit-font-smoothing:antialiased;transform:translateZ(0);display:flex;justify-content:space-between;font-weight:700;font-size:15px}
#day{position:relative;z-index:5;flex:none;height:4px;background:#9c4221}#day i{display:block;height:100%;background:#fbd38d;width:0}
#main{flex:1;min-height:0;overflow-y:auto;position:relative;z-index:1;padding:10px;-webkit-overflow-scrolling:touch}
#tabs{flex:none;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:11px;font-weight:600;color:#777}
#tabs button span{display:block;font-size:22px}#tabs button.on{color:#c05621;background:#fff5eb}
.card{background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 2px 5px #0001}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:4px 0}
h3{margin:0 0 6px;font-size:16px}small{color:#777}
.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;background:#dd6b20;color:#fff;min-height:38px}
.btn.g{background:#38a169}.btn.b{background:#3182ce}.btn.x{background:#a0aec0}.btn:disabled{opacity:.4}
.bar{height:16px;background:#edf2f7;border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f6ad55,#dd6b20);transition:width .5s}
.st{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}.st b{font-size:10px;padding:3px 5px;border-radius:6px;background:#edf2f7;color:#888;font-weight:600}
.st b.d{background:#c6f6d5;color:#276749}.st b.c{background:#fbd38d;color:#7b341e}
.mt{font-size:12px;display:flex;flex-wrap:wrap;gap:4px}.mt span{background:#f7fafc;border-radius:6px;padding:2px 6px}.mt .no{background:#fed7d7;color:#c53030}
.chip{font-size:11px;background:#ebf8ff;border-radius:6px;padding:3px 6px;margin:2px;display:inline-block}
#msg{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;background:#9ae6b4;padding:8px;border-radius:12px;background-image:linear-gradient(#a0aec0 0 0),linear-gradient(#a0aec0 0 0);background-size:4px 100%,100% 4px;background-position:33.5% 0,0 50%;background-repeat:no-repeat}.plot{background:#c6f6d5;border:2px dashed #68d391;border-radius:10px;min-height:92px;padding:4px;text-align:center;font-size:11px}.plot.bld{background:#fefcbf;border:2px solid #ecc94b}.plot.own{background:#bee3f8;border:2px solid #4299e1}.plot.am{background:#fed7e2;border:2px solid #ed64a6}.plot.sel{outline:3px solid #dd6b20}.pe{font-size:30px}.ic{width:1.6em;height:1.6em;vertical-align:middle;display:inline-block}.mt .ic{width:1.5em;height:1.5em}.row>span>.ic{width:34px;height:34px;margin-right:4px}.house{font-size:40px;text-align:center}
</style></head><body><div id="app">
<div id="top"><span id="mo"></span><span id="dy"></span><span id="sd"></span></div><div id="day"><i id="dp"></i></div>
<div id="main"></div>
<div id="tabs"><button data-t="s" class="on"><span>🏗️</span>Şantiye</button><button data-t="h"><span>🗺️</span>Harita</button><button data-t="p"><span>👷</span>Personel</button><button data-t="m"><span>🧱</span>Malzeme</button><button data-t="u"><span>⬆️</span>Yükseltmeler</button></div>
</div><div id="msg"></div>
<script>
const DAY=30,NP=15;
const AM={park:['Park','🌳',3000,10,2],oyun:['Oyun Alanı','🛝',4500,10,3],havuz:['Havuz','🏊',8000,15,4],market:['Market','🏪',11000,15,5],okul:['Okul','🏫',16000,20,6],cami:['Cami/Meydan','🕌',22000,25,7]};
const cStep=l=>Math.round(700*Math.pow(l,1.5)/5)*5,lvNeed=l=>{let t=0;for(let i=1;i<l;i++)t+=cStep(i);return t},RF={isci:150,kalfa:180,usta:210,muh:250},sNeed=s=>Math.round(RF[s.t]*(1+.5*(s.l-1))),STP=.5,plvl=()=>{let l=1;while(S.xp>=lvNeed(l+1))l++;return l};
const occ=i=>S.sites.some(y=>y.pl==i)||S.am.some(y=>y.pl==i);
const near=(a,b)=>a!=b&&Math.abs(a%3-b%3)<=1&&Math.abs((a/3|0)-(b/3|0))<=1;
const bonus=pl=>S.am.filter(a=>near(a.pl,pl)).reduce((t,a)=>t+AM[a.t][3],0);// saniye = 1 gün
const MAT={cimento:['Çimento','<svg class="ic" viewBox="0 0 32 32"><path d="M6 7 Q16 3 26 7 L28 27 Q16 30 4 27Z" fill="#cbb994" stroke="#7a6a48" stroke-width="1.2"/><rect x="5.5" y="13" width="21" height="7" fill="#c53030"/><text x="16" y="18.6" font-size="5" font-weight="900" text-anchor="middle" fill="#fff" font-family="Arial">ÇİMENTO</text><path d="M8 9h16" stroke="#7a6a48"/></svg>','torba',20],demir:['Demir','<svg class="ic" viewBox="0 0 32 32"><g stroke="#4a5568" stroke-width="2.6" stroke-linecap="round"><path d="M3 22 L29 10"/><path d="M3 26 L29 14"/><path d="M5 18 L29 6"/></g><g stroke="#a0aec0" stroke-width="1" stroke-dasharray="1.5 1.5"><path d="M3 22 L29 10"/><path d="M3 26 L29 14"/><path d="M5 18 L29 6"/></g><path d="M11 12v14M21 8v14" stroke="#c05621" stroke-width="2.2"/></svg>','ton',30],tugla:['Tuğla','<svg class="ic" viewBox="0 0 32 32"><rect x="2" y="22" width="12" height="6" rx="1" fill="#c0392b" stroke="#7b241c" stroke-width="1"/><rect x="15" y="22" width="12" height="6" rx="1" fill="#c0392b" stroke="#7b241c" stroke-width="1"/><rect x="8" y="15" width="12" height="6" rx="1" fill="#c0392b" stroke="#7b241c" stroke-width="1"/><rect x="21" y="15" width="12" height="6" rx="1" fill="#c0392b" stroke="#7b241c" stroke-width="1"/><rect x="2" y="8" width="12" height="6" rx="1" fill="#c0392b" stroke="#7b241c" stroke-width="1"/><rect x="15" y="8" width="12" height="6" rx="1" fill="#c0392b" stroke="#7b241c" stroke-width="1"/><rect x="2" y="15" width="5" height="6" rx="1" fill="#c0392b" stroke="#7b241c"/></svg>','adet',1],kum:['Kum','<svg class="ic" viewBox="0 0 32 32"><path d="M2 27 Q9 9 16 8 Q24 9 30 27Z" fill="#e9c46a" stroke="#b08d2e" stroke-width="1.2"/><g fill="#b08d2e"><circle cx="12" cy="18" r=".9"/><circle cx="18" cy="14" r=".9"/><circle cx="20" cy="21" r=".9"/><circle cx="9" cy="24" r=".9"/><circle cx="15" cy="23" r=".9"/></g><path d="M23 6 L27 2 M25 7 L29 5" stroke="#4a5568" stroke-width="1.6"/></svg>','m³',10],kereste:['Kereste','<svg class="ic" viewBox="0 0 32 32"><rect x="2" y="8" width="28" height="5" rx="1" fill="#d69e5e" stroke="#6b3e1d" stroke-width="1"/><rect x="2" y="14" width="28" height="5" rx="1" fill="#c58940" stroke="#6b3e1d" stroke-width="1"/><rect x="2" y="20" width="28" height="5" rx="1" fill="#d69e5e" stroke="#6b3e1d" stroke-width="1"/><g fill="none" stroke="#8b5a2b" stroke-width=".7"><path d="M6 10.5h7M17 16.5h8M8 22.5h9"/></g><g fill="#f6d7a7" stroke="#6b3e1d" stroke-width=".8"><circle cx="3.5" cy="10.5" r="1.6"/><circle cx="3.5" cy="16.5" r="1.6"/><circle cx="3.5" cy="22.5" r="1.6"/></g></svg>','m³',25],boya:['Boya','<svg class="ic" viewBox="0 0 32 32"><path d="M7 10 L9 28 H23 L25 10Z" fill="#3182ce" stroke="#1a4f8a" stroke-width="1.2"/><ellipse cx="16" cy="10" rx="9" ry="2.6" fill="#90cdf4" stroke="#1a4f8a"/><path d="M10 10 Q11 17 12 10 M17 11 Q18 20 19 11" fill="#90cdf4"/><circle cx="18" cy="21" r="1.4" fill="#90cdf4"/><path d="M8 10 Q16 -1 24 10" fill="none" stroke="#4a5568" stroke-width="1.3"/><rect x="10" y="17" width="12" height="5" fill="#fff" opacity=".85"/><text x="16" y="21" font-size="3.8" font-weight="900" text-anchor="middle" fill="#1a4f8a" font-family="Arial">BOYA</text></svg>','kova',20],kablo:['Kablo/Boru','<svg class="ic" viewBox="0 0 32 32"><circle cx="11" cy="16" r="8.5" fill="none" stroke="#e53e3e" stroke-width="2.6"/><circle cx="11" cy="16" r="5" fill="none" stroke="#e53e3e" stroke-width="2.6"/><circle cx="11" cy="16" r="1.6" fill="#2d3748"/><path d="M19 16 Q22 22 17 27" fill="none" stroke="#e53e3e" stroke-width="2"/><rect x="22" y="3" width="6" height="26" rx="1.5" fill="#e2e8f0" stroke="#718096" stroke-width="1.2"/><rect x="21" y="7" width="8" height="3" fill="#a0aec0"/><rect x="21" y="22" width="8" height="3" fill="#a0aec0"/></svg>','top',15]};
const STG=[['Hafriyat',30,{},0],['Temel',50,{cimento:20,demir:10,kum:10},1],['Kaba inşaat (Karkas)',80,{cimento:30,demir:20,kereste:10},1],['Duvar örme',60,{tugla:1000,cimento:10},0],['Çatı',40,{kereste:20},0],['Elektrik-Tesisat',40,{kablo:20},1],['Sıva',40,{cimento:15,kum:20},0],['Boya',30,{boya:15},0],['Teslim',10,{},1]];
const PRJ={ev:{n:'Müstakil Ev',e:'🏠',land:1000,k:1,sell:14000,need:0,tp:100,lv:0},villa:{n:'Villa',e:'🏡',land:4000,k:2.5,sell:36000,need:2,tp:350,lv:5},apt:{n:'Apartman',e:'🏢',land:12000,k:6,sell:95000,need:5,tp:1000,lv:10}};
const STF={isci:{n:'İşçi',e:'👷',hire:300,wage:40,pow:1},kalfa:{n:'Kalfa',e:'🧑‍🔧',hire:900,wage:90,pow:2.5},usta:{n:'Usta',e:'👨‍🏭',hire:2200,wage:180,pow:5},muh:{n:'Mühendis',e:'👩‍💼',hire:2000,wage:150,pow:0}};
const def=()=>({m:15000,day:1,t:0,sold:0,staff:[],inv:Object.fromEntries(Object.keys(MAT).map(k=>[k,0])),sites:[],nid:1,sid:1,key:0,star:0});
let S;try{S=JSON.parse(localStorage.getItem('muteahhit'))}catch(e){}if(!S)S=def();S.key=S.key||0;S.star=S.star||0;S.sel=-1;S.xp=S.xp||0;S.staff.forEach(s=>s.xp=s.xp||0);if(S.ver!=2){S.xp=Math.round(S.xp*1000/140);S.staff.forEach(s=>s.xp=s.xp*5);S.ver=2}if(S.ver==2){S.xp=Math.round(S.xp/10);S.staff.forEach(s=>s.xp=Math.round(s.xp/10));S.ver=3}S.am=S.am||[];S.sites.forEach(x=>{if(x.pl==null){for(let i=0;i<NP;i++)if(!S.sites.some(y=>y.pl===i)){x.pl=i;break}}});
let tab='s';const $=i=>document.getElementById(i),f=n=>Math.round(n).toLocaleString('tr-TR');
const save=()=>localStorage.setItem('muteahhit',JSON.stringify(S));
function toast(t){$('msg').textContent=t;$('msg').style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$('msg').style.opacity=0,1600)}
const wage=s=>STF[s.t].wage*(1+.15*(s.l-1));
const power=s=>STF[s.t].pow*(1+.2*(s.l-1))*(1+.05*s.tool);
const need=(site,i)=>Object.fromEntries(Object.entries(STG[i][2]).map(([k,v])=>[k,Math.ceil(v*PRJ[site.type].k)]));
const onSite=id=>S.staff.filter(s=>s.site==id);
const hasEng=id=>onSite(id).some(s=>s.t=='muh');
function rate(site){const w=onSite(site.id);let p=w.filter(s=>s.t!='muh').reduce((a,s)=>a+power(s),0);const e=w.filter(s=>s.t=='muh');
 if(STG[site.st][3]&&!e.length)return 0;p*=1+e.reduce((a,s)=>a+.15*s.l,0);return p/PRJ[site.type].k}
function price(site){const e=Math.max(0,...S.staff.filter(s=>s.t=='muh').map(s=>s.l));return PRJ[site.type].sell*(1+.05*e)}
function tick(){S.t++;for(const site of S.sites){if(!site.go||site.done)continue;const rr=rate(site);site.p+=rr;if(rr>0)onSite(site.id).forEach(s=>s.xp+=STP);const w=STG[site.st][1];
 if(site.p>=w){site.p=0;site.go=0;const k=PRJ[site.type].k,ak=Math.ceil(k),ay=Math.ceil(k);S.key+=ak;S.star+=ay;const L0=plvl();const stp=Math.round(PRJ[site.type].tp*.05);S.xp+=stp;toast('✅ '+STG[site.st][0]+' tamamlandı +'+ak+'🔑 +'+ay+'⭐ +'+f(stp)+' TP');if(site.st==STG.length-1){site.done=1;onSite(site.id).forEach(s=>s.site=0);const bk=Math.ceil(8*k),by=Math.ceil(5*k);S.key+=bk;S.star+=by;const btp=PRJ[site.type].tp-9*Math.round(PRJ[site.type].tp*.05);S.xp+=btp;setTimeout(()=>toast('🏆 Proje bitti! Bonus +'+bk+'🔑 +'+by+'⭐ +'+f(btp)+' TP'),1700)}else site.st++;if(plvl()>L0)setTimeout(()=>toast('🎖️ Müteahhit Seviyesi '+plvl()+'!'),3400)}}
 if(S.t>=DAY){S.t=0;S.day++;const w=S.staff.reduce((a,s)=>a+wage(s),0),ri=S.sites.filter(x=>x.rent).reduce((a,x)=>a+rentOf(x),0);S.m+=ri-w;if(w||ri)toast('📅 Gün '+S.day+': maaş -'+f(w)+'₺'+(ri?' · kira +'+f(ri)+'₺':''));if(S.m<0)toast('⚠️ Kasa eksiye düştü!')}
 save();render()}
const A={
 tab:t=>{tab=t},
 land:t=>{const p=PRJ[t],g=gate(t);if(g)return toast(g);let pl=S.sel>=0&&!occ(S.sel)?S.sel:[...Array(NP).keys()].find(i=>!occ(i));if(pl==null)return toast('Boş arsa yok');S.sel=-1;if(S.m<p.land)return toast('Yetersiz para');S.m-=p.land;S.sites.push({id:S.sid++,type:t,st:0,p:0,go:0,done:0,pl});toast(p.n+' arsası alındı (Parsel '+(pl+1)+')')},
 amen:t=>{const a=AM[t];if(plvl()<a[4])return toast('🔒 Müteahhit Sv.'+a[4]+' gerekli');if(S.sel<0||occ(S.sel))return toast('Önce boş parsel seç');if(S.m<a[2])return toast('Yetersiz para');S.m-=a[2];S.am.push({t,pl:S.sel});toast(a[1]+' '+a[0]+' yapıldı');S.sel=-1},
 pick:i=>{S.sel=+i;const x=S.sites.find(y=>y.pl==i);if(x&&!x.done){tab='s'}},
 rent:id=>{const x=S.sites.find(s=>s.id==id);x.rent=1;toast('🔑 Kiraya verildi: +'+f(rentOf(x))+'₺/gün')},
 start:id=>{const site=S.sites.find(s=>s.id==id),n=need(site,site.st);for(const k in n)if(S.inv[k]<n[k])return toast('Eksik malzeme: '+MAT[k][0]);
  if(STG[site.st][3]&&!hasEng(id))return toast('Bu aşama için Mühendis gerekli');if(!onSite(id).some(s=>s.t!='muh'))return toast('Önce işçi ata');for(const k in n)S.inv[k]-=n[k];site.go=1;toast('🚧 '+STG[site.st][0]+' başladı')},
 buyn:id=>{const site=S.sites.find(s=>s.id==id),n=need(site,site.st);let c=0;for(const k in n)c+=Math.max(0,n[k]-S.inv[k])*MAT[k][3];if(S.m<c)return toast('Yetersiz para ('+f(c)+'₺)');S.m-=c;for(const k in n)S.inv[k]=Math.max(S.inv[k],n[k]);toast('Malzemeler alındı -'+f(c)+'₺')},
 idle:id=>{let c=0;S.staff.forEach(s=>{if(!s.site){s.site=+id;c++}});toast(c?c+' personel atandı':'Boşta personel yok')},
 sell:id=>{const i=S.sites.findIndex(s=>s.id==id),site=S.sites[i],p=price(site);S.m+=p;S.sold++;onSite(+id).forEach(s=>s.site=0);S.sites.splice(i,1);toast('💰 Satıldı: +'+f(p)+'₺')},
 hire:t=>{const c=STF[t].hire;if(S.m<c)return toast('Yetersiz para');S.m-=c;S.staff.push({id:S.nid++,t,l:1,tool:0,site:0,xp:0});toast(STF[t].n+' işe alındı')},
 fire:id=>{S.staff=S.staff.filter(s=>s.id!=id)},
 asg:id=>{const s=S.staff.find(s=>s.id==id),ids=[0,...S.sites.filter(x=>!x.done).map(x=>x.id)];s.site=ids[(ids.indexOf(s.site)+1)%ids.length]||0},
 buy:a=>{const[k,q]=a.split(':'),c=MAT[k][3]*q;if(S.m<c)return toast('Yetersiz para');S.m-=c;S.inv[k]+=+q},
 lvl:id=>{const s=S.staff.find(s=>s.id==id),c=lvC(s),y=s.l*2;if(s.l>=10)return toast('Maks seviye');if(s.xp<sNeed(s))return toast('Önce TP barı dolmalı ('+f(s.xp)+' / '+f(sNeed(s))+')');if(S.m<c)return toast('Yetersiz para');if(S.star<y)return toast(y+'⭐ gerekli');S.m-=c;S.star-=y;s.xp-=sNeed(s);s.l++;toast(STF[s.t].n+' seviye '+s.l)},
 tool:id=>{const s=S.staff.find(s=>s.id==id),c=tlC(s),a=(s.tool+1)*3;if(s.tool>=5)return toast('Maks ekipman');if(S.m<c)return toast('Yetersiz para');if(S.key<a)return toast(a+'🔑 gerekli');S.m-=c;S.key-=a;s.tool++;toast('🔧 Ekipman '+s.tool)},
 reset:()=>{if(confirm('Tüm ilerleme silinsin mi?')){S=def();}}};
const gate=t=>{const p=PRJ[t];if(!p.lv)return S.sold<p.need?p.need+' satış gerekli':'';const n=S.staff.length,r=S.staff.filter(s=>s.l>=p.lv).length;if(!n)return p.n+': en az 1 personel gerekli';if(r<n)return p.n+': tüm personel Sv.'+p.lv+' olmalı ('+r+'/'+n+' hazır)';if(S.sold<p.need)return p.n+': '+p.need+' satış gerekli ('+S.sold+'/'+p.need+')';return ''};
const rentOf=x=>Math.round(PRJ[x.type].sell*.04*(1+bonus(x.pl)/100));
const lvC=s=>Math.round(STF[s.t].hire*.25*s.l),tpBar=(a,b)=>`<div class="bar" style="height:8px;margin:3px 0"><i style="width:${Math.min(100,a/b*100)}%;background:linear-gradient(90deg,#9f7aea,#6b46c1)"></i></div>`,tlC=s=>Math.round(STF[s.t].hire*.35*(s.tool+1));
const B=(a,x,t,c='',dis)=>`<button class="btn ${c}" data-a="${a}" data-x="${x}" ${dis?'disabled':''}>${t}</button>`;
function render(){const tw=S.staff.reduce((a,s)=>a+wage(s),0);$('mo').textContent='💰 '+f(S.m)+'₺';$('dy').textContent='🔑'+S.key+' ⭐'+S.star+' · G'+S.day;$('sd').textContent='🎖️Sv'+plvl()+' 👷'+S.staff.length+' -'+f(tw);$('dp').style.width=S.t/DAY*100+'%';
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));let h='';
if(tab=='s'){S.sites.forEach(site=>{const P=PRJ[site.type],w=onSite(site.id),n=need(site,site.st),st=STG[site.st],r=rate(site);
 h+=`<div class="card"><div class="row"><h3>${P.e} ${P.n} #${site.id}</h3><small>${site.done?'Hazır':'Aşama '+(site.st+1)+'/'+STG.length}</small></div>
 <div class="st">${STG.map((s,i)=>`<b class="${i<site.st||site.done?'d':i==site.st?'c':''}">${s[0]} +${Math.round(P.tp*.05)}TP</b>`).join('')}</div>`;
 if(site.done)h+=`<div class="house">${P.e}${site.rent?'🔑':'🎉'}</div><div class="row">`+(site.rent?'<small>Kirada: +'+f(rentOf(site))+'₺/gün</small>':B('rent',site.id,'🔑 Kirala +'+f(rentOf(site))+'₺/gün','b'))+B('sell',site.id,'Sat: +'+f(price(site))+'₺','g')+'</div>';
