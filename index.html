 h+='<div class="card">'+Object.entries(MAC).map(([k,m])=>{const bo=!!m[5],lk=plvl()<m[4],r=ms&&S.mac.find(x=>x.t==k&&x.site==ms.id&&(x.own||x.until>S.gt));return `<div class="row"><span>${m[1]} <b>${m[0]}</b><br><small>${f(m[2])}₺/gün${bo?' · '+m[5].map(i=>STG[i][0]).join(', '):''}${r?(r.own?' · ✅ sahip':' · ✅ kalan '+gs(r.until-S.gt)):''}</small>${lk&&bo?'<br><small style="color:#c53030">🔒 Sv.'+m[4]+'</small>':''}</span><span>${B('mrent',k+':'+(ms?ms.id:0),'Kirala '+f(rentP(k,S.rd))+'₺','b',(bo&&lk)||!ms)}${bo?'':' '+B('mbuy',k,(lk?'🔒 Sv.'+m[4]:'Al '+f(m[3])+'₺'),'',lk)}</span></div>`}).join('')+'</div>';
 const own=S.mac.filter(m=>m.own);if(own.length)h+='<div class="card"><h3>Sahip olunan</h3>'+own.map(m=>{const x=S.sites.find(y=>y.id==m.site&&!y.done);return `<div class="row"><span>${MAC[m.t][1]} ${MAC[m.t][0]}<br><small>⏳ ${gs(LIFE-(S.gt-m.born))} · 🔧 ${f(MAC[m.t][2]*.1)}₺/gün</small></span>${B('masg',m.id,x?PRJ[x.type].e+' #'+x.id:'Boşta','b')}</div>`}).join('')+'</div>'}
if(tab=='p'){h='<div class="card"><h3>İşe Al</h3><div class="hint">Ekibini kur, şantiyeye ata.</div>'+Object.entries(STF).map(([k,s])=>`<div class="row"><span>${s.e} <b>${s.n}</b><br><small>${k=='muh'?'<span class="tg">🏛️ şart</span><span class="tg">+%15 hız</span><span class="tg">+%5 satış</span>':'Hız '+s.pow}, maaş ${s.wage}₺/gün</small></span>${B('hire',k,f(s.hire)+'₺')}</div>`).join('')+'</div>';
 h+='<div class="card"><h3>Ekibim</h3>'+(S.staff.map(s=>{const site=S.sites.find(x=>x.id==s.site);return `<div class="row"><span>${STF[s.t].e} ${STF[s.t].n} Lv${s.l} 🛠️${s.tool}<br><small>${s.t=='muh'?'':'Hız '+power(s).toFixed(1)+' · '}${f(wage(s))}₺/gün · TP: ${Math.floor(s.xp)} / ${f(sNeed(s))}</small>${tpBar(s.xp,sNeed(s))}</span>${B('asg',s.id,site?PRJ[site.type].e+' #'+site.id:'Boşta','b')}${B('fire',s.id,'✖','x')}</div>`}).join('')||'<small>Henüz personel yok</small>')+'</div>'}
if(tab=='m'){h='<div class="card"><h3>🛒 Malzeme Pazarı</h3><div class="hint">Al, depola, aşamada kullan.</div>'+Object.entries(MAT).map(([k,m])=>{const q=k=='tugla'?1000:k=='demir'?1:10;return `<div class="row"><span>${m[1]} <b>${m[0]}</b><br><small>${m[3]}₺/${m[2]} · Depo: ${f(S.inv[k])}</small></span><span>${B('buy',k+':'+q,'+'+q)} ${B('buy',k+':'+q*10,'+'+q*10,'b')}</span></div>`}).join('')+'</div>'}
if(tab=='u'){h='<div class="card"><h3>⬆️ Yükseltmeler</h3><div class="hint">Çalış, TP topla, ⭐ ile seviye atla.</div><div><span class="tg">⭐ +%20 hız</span><span class="tg">🛠️ +%5 hız</span></div></div>'+(S.staff.map(s=>`<div class="card"><div class="row"><b>${STF[s.t].e} ${STF[s.t].n} #${s.id}</b><small>Sv${s.l} · 🛠️${s.tool}</small></div><small>TP: ${Math.floor(s.xp)} / ${f(sNeed(s))}${s.xp>=sNeed(s)?' ✅':''}</small>${tpBar(s.xp,sNeed(s))}<div class="row">${B('lvl',s.id,'⭐ Seviye atla '+f(lvC(s))+'₺ + '+s.l*2+'⭐','',s.l>=10||s.xp<sNeed(s))}${s.t!='muh'?B('tool',s.id,'🛠️ Ekipman '+f(tlC(s))+'₺ + '+(s.tool+1)*3+'🔧','b',s.tool>=5):''}</div></div>`).join('')||'<div class="card"><small>Önce personel işe al</small></div>');
 h+=`<div class="card">${B('reset',0,'🗑️ Oyunu sıfırla','x')}</div>`}
$('main').innerHTML=h}
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-t]');if(!b)return;if(b.dataset.t)A.tab(b.dataset.t);else A[b.dataset.a](b.dataset.x);save();render()});
document.addEventListener('gesturestart',e=>e.preventDefault());
setInterval(tick,1000);render();
if('serviceWorker'in navigator){let rl=0;navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();setInterval(()=>r.update(),60000)});const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=1;location.reload()}})}
